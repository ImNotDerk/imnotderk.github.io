  <rect width="1600" height="900" fill="url(#dawnSky)" />
  <rect width="1600" height="900" fill="url(#blueAurora)" />
  <rect width="1600" height="900" fill="url(#violetAurora)" />

  <!-- Sweeping atmospheric horizon layers -->
  <path d="M-80 650 C260 540, 480 680, 820 570 C1120 470, 1340 590, 1680 460 L1680 940 L-80 940 Z" fill="url(#horizonGlow)" />
