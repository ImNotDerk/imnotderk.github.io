  <path d="M-60 620 C240 500, 540 620, 860 500 C1180 380, 1390 480, 1660 360" stroke="url(#ribbon1)" stroke-width="2" stroke-opacity="0.7" />
  <path d="M-60 530 C300 410, 580 510, 940 390 C1240 290, 1420 350, 1660 250" stroke="url(#ribbon1)" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Subtle topographic elevation contours -->
