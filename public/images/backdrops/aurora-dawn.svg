<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="dawnSky" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="45%" stop-color="#0b1330" />
      <stop offset="100%" stop-color="#1b0d38" />
    </linearGradient>
    <radialGradient id="blueAurora" cx="24%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.58" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetAurora" cx="78%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.52" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ribbon1" x1="120" y1="620" x2="1480" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="35%" stop-color="#60a5fa" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#818cf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
