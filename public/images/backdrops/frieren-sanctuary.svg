<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="fsSky" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040714" />
      <stop offset="50%" stop-color="#0c1433" />
      <stop offset="100%" stop-color="#1d1340" />
    </linearGradient>
    <radialGradient id="fsStarlight" cx="78%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#f5d08a" stop-opacity="0.22" />
      <stop offset="38%" stop-color="#7dd3fc" stop-opacity="0.2" />
      <stop offset="72%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#040714" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fsManaGlow" cx="24%" cy="76%" r="46%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#c4b5fd" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#040714" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fsRidge" x1="800" y1="590" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c122e" />
      <stop offset="100%" stop-color="#03050e" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#fsSky)" />
  <rect width="1600" height="900" fill="url(#fsStarlight)" />
  <rect width="1600" height="900" fill="url(#fsManaGlow)" />

  <!-- Subtle starry sky -->
  <circle cx="280" cy="145" r="1.4" fill="#e0f2fe" fill-opacity="0.6" />
  <circle cx="510" cy="110" r="1.2" fill="#fde68a" fill-opacity="0.55" />
  <circle cx="715" cy="185" r="1.5" fill="#bae6fd" fill-opacity="0.65" />
  <circle cx="890" cy="95" r="1.3" fill="#ddd6fe" fill-opacity="0.6" />
  <circle cx="1040" cy="140" r="1.7" fill="#f5d08a" fill-opacity="0.65" />
  <circle cx="1430" cy="125" r="1.4" fill="#bae6fd" fill-opacity="0.65" />
  <circle cx="1475" cy="450" r="1.5" fill="#e9d5ff" fill-opacity="0.55" />
  <circle cx="420" cy="390" r="1.2" fill="#93c5fd" fill-opacity="0.5" />

  <!-- Astral mana spell circles & starlight geometry (upper right / center) -->
  <g transform="translate(1235 285)">
    <circle r="235" stroke="#7dd3fc" stroke-opacity="0.18" stroke-width="1.2" />
    <circle r="218" stroke="#f5d08a" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6 10" />
    <circle r="165" stroke="#c4b5fd" stroke-opacity="0.22" stroke-width="1.2" />
    <circle r="112" stroke="#f5d08a" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 7" />
    <polygon
      points="0,-165 143,82.5 -143,82.5"
      stroke="#7dd3fc"
      stroke-opacity="0.16"
      stroke-width="1"
    />
    <polygon
      points="0,165 143,-82.5 -143,-82.5"
      stroke="#f5d08a"
      stroke-opacity="0.15"
      stroke-width="1"
    />
    <circle cx="0" cy="-165" r="3" fill="#f5d08a" fill-opacity="0.7" />
    <circle cx="143" cy="82.5" r="3" fill="#bae6fd" fill-opacity="0.7" />
    <circle cx="-143" cy="82.5" r="3" fill="#bae6fd" fill-opacity="0.7" />
    <circle cx="0" cy="165" r="3" fill="#f5d08a" fill-opacity="0.7" />
    <circle cx="143" cy="-82.5" r="3" fill="#c4b5fd" fill-opacity="0.7" />
    <circle cx="-143" cy="-82.5" r="3" fill="#c4b5fd" fill-opacity="0.7" />
  </g>

  <!-- Distant twilight sanctuary arches along the horizon -->
  <path
    d="M0 725 L190 708 L190 618 C190 590, 232 590, 232 618 L232 704 L290 700 L290 638 C290 615, 326 615, 326 638 L326 697 C540 682, 820 732, 1080 688 L1080 612 C1080 578, 1134 578, 1134 612 L1134 684 L1176 682 L1176 626 C1176 598, 1222 598, 1222 626 L1222 680 C1370 676, 1500 698, 1600 684 L1600 900 L0 900 Z"
    fill="url(#fsRidge)"
    fill-opacity="0.88"
  />
  <path
    d="M0 780 C340 735, 680 815, 1040 765 C1290 730, 1460 770, 1600 755 L1600 900 L0 900 Z"
    fill="#070b1c"
  />

  <!-- Drifting glowing Blue-Moon Weed (蒼月草) petals & mana motes -->
  <g>
    <circle cx="960" cy="610" r="14" fill="#60a5fa" fill-opacity="0.18" />
    <ellipse cx="960" cy="610" rx="5.5" ry="2.2" transform="rotate(-24 960 610)" fill="#bae6fd" fill-opacity="0.85" />

    <circle cx="1115" cy="545" r="12" fill="#f5d08a" fill-opacity="0.16" />
    <ellipse cx="1115" cy="545" rx="4.5" ry="2" transform="rotate(18 1115 545)" fill="#fde68a" fill-opacity="0.8" />

    <circle cx="1310" cy="635" r="15" fill="#7dd3fc" fill-opacity="0.2" />
    <ellipse cx="1310" cy="635" rx="6" ry="2.4" transform="rotate(-38 1310 635)" fill="#e0f2fe" fill-opacity="0.85" />

    <circle cx="1430" cy="585" r="13" fill="#c4b5fd" fill-opacity="0.18" />
    <ellipse cx="1430" cy="585" rx="5" ry="2.1" transform="rotate(32 1430 585)" fill="#e9d5ff" fill-opacity="0.8" />

    <circle cx="835" cy="670" r="2" fill="#7dd3fc" fill-opacity="0.7" />
    <circle cx="1015" cy="580" r="2.2" fill="#f5d08a" fill-opacity="0.7" />
    <circle cx="1205" cy="535" r="1.8" fill="#bae6fd" fill-opacity="0.75" />
    <circle cx="1370" cy="670" r="2" fill="#c4b5fd" fill-opacity="0.68" />
    <circle cx="1495" cy="630" r="2.2" fill="#7dd3fc" fill-opacity="0.65" />
  </g>
</svg>
