<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="25%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="78%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="120" y1="120" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.12" />
    </pattern>
  </defs>

  <rect width="400" height="500" fill="url(#bgGrad)" />
  <rect width="400" height="500" fill="url(#dots)" />
  <rect width="400" height="500" fill="url(#glowBlue)" />
  <rect width="400" height="500" fill="url(#glowPurple)" />

  <!-- Subtle orbital rings -->
  <circle cx="200" cy="210" r="130" stroke="url(#ringGrad)" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 6" />
  <circle cx="200" cy="210" r="95" stroke="url(#ringGrad)" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Stylized portrait silhouette -->
  <circle cx="200" cy="182" r="34" fill="#1e293b" stroke="url(#ringGrad)" stroke-width="2" />
  <path d="M132 292c0-36 30-60 68-60s68 24 68 60" fill="#1e293b" stroke="url(#ringGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Monogram badge -->
  <rect x="136" y="348" width="128" height="32" rx="16" fill="#09090b" fill-opacity="0.65" stroke="url(#ringGrad)" stroke-opacity="0.55" />
  <text x="200" y="368" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e2e8f0">
    YOUR PHOTO HERE
  </text>
  <text x="200" y="404" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#94a3b8">
    public/images/profile-placeholder.svg
  </text>
</svg>
