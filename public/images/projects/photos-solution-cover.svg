  <line x1="56" y1="116" x2="744" y2="116" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1" />

  <!-- Streaming Connector -->
  <path d="M296 248 H504" stroke="url(#linkP)" stroke-width="2" stroke-dasharray="6 4" />
  <polygon points="498,243 508,248 498,253" fill="#34d399" />
  <rect x="328" y="216" width="144" height="22" rx="4" fill="#0b1020" stroke="#38bdf8" stroke-opacity="0.45" />
  <text x="400" y="231" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#bae6fd">Chunked Wi-Fi Stream</text>
  <text x="400" y="269" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#6ee7b7">POST /api/upload</text>

