  <rect x="56" y="170" width="240" height="158" rx="12" fill="#0d1324" fill-opacity="0.92" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5" />
  <text x="78" y="202" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.4" fill="#38bdf8">IOS 17+ NATIVE / WEB</text>
  <text x="78" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">PhotoKit Asset Bundles</text>
  <text x="78" y="254" font-family="ui-monospace, monospace" font-size="10.5" fill="#94a3b8">Swift 6 · SwiftUI · React</text>
