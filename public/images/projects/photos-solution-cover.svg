<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgP" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="55%" stop-color="#0c1526" />
      <stop offset="100%" stop-color="#13162b" />
    </linearGradient>
    <linearGradient id="linkP" x1="296" y1="248" x2="504" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#f5d08a" />
    </linearGradient>
    <pattern id="gridP" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgP)" />
  <rect width="800" height="450" fill="url(#gridP)" />

  <circle cx="185" cy="145" r="185" fill="#38bdf8" fill-opacity="0.11" />
