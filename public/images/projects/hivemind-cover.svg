<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="55%" stop-color="#121428" />
      <stop offset="100%" stop-color="#1b1430" />
    </linearGradient>
