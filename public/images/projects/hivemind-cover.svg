      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#f5d08a" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="gridH" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1" />
