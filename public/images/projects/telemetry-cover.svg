<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="tBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="50%" stop-color="#17163b" />
      <stop offset="100%" stop-color="#271242" />
    </linearGradient>
    <linearGradient id="wave" x1="120" y1="260" x2="680" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="waveFill" x1="400" y1="150" x2="400" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#tBg)" />
  <circle cx="240" cy="120" r="190" fill="#3b82f6" fill-opacity="0.16" />
  <circle cx="590" cy="300" r="190" fill="#a855f7" fill-opacity="0.18" />

  <!-- Console frame -->
  <rect x="88" y="64" width="624" height="322" rx="18" fill="#090d1a" fill-opacity="0.88" stroke="#6366f1" stroke-opacity="0.45" stroke-width="1.5" />
  <line x1="88" y1="108" x2="712" y2="108" stroke="#ffffff" stroke-opacity="0.08" />

  <circle cx="118" cy="86" r="5" fill="#60a5fa" />
  <circle cx="136" cy="86" r="5" fill="#818cf8" />
  <circle cx="154" cy="86" r="5" fill="#c084fc" />
  <text x="180" y="90" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">trace://live-stream • 60fps virtualized</text>

  <!-- Telemetry trace curve -->
  <path d="M122 292 C180 280, 210 210, 268 228 C326 246, 360 155, 422 178 C484 201, 520 148, 580 164 C625 176, 650 138, 678 145 L678 330 L122 330 Z" fill="url(#waveFill)" />
  <path d="M122 292 C180 280, 210 210, 268 228 C326 246, 360 155, 422 178 C484 201, 520 148, 580 164 C625 176, 650 138, 678 145" stroke="url(#wave)" stroke-width="3" stroke-linecap="round" />

  <!-- Span bars -->
  <rect x="122" y="132" width="160" height="10" rx="5" fill="#3b82f6" fill-opacity="0.55" />
  <rect x="296" y="132" width="210" height="10" rx="5" fill="#818cf8" fill-opacity="0.55" />
  <rect x="520" y="132" width="158" height="10" rx="5" fill="#c084fc" fill-opacity="0.55" />

  <!-- Log pills -->
  <rect x="122" y="340" width="170" height="24" rx="6" fill="#1e293b" />
  <text x="134" y="356" font-family="ui-monospace, monospace" font-size="10" fill="#93c5fd">50k rows buffered</text>
  <rect x="306" y="340" width="144" height="24" rx="6" fill="#1e1b4b" />
  <text x="318" y="356" font-family="ui-monospace, monospace" font-size="10" fill="#c4b5fd">-35% MTTR</text>
</svg>
