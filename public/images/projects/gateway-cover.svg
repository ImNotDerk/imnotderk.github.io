<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070d1f" />
      <stop offset="55%" stop-color="#17123b" />
      <stop offset="100%" stop-color="#2b0f47" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="330" y1="120" x2="470" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#gBg)" />
  <circle cx="400" cy="225" r="190" fill="#4f46e5" fill-opacity="0.16" />
  <circle cx="560" cy="140" r="150" fill="#a855f7" fill-opacity="0.15" />

  <!-- Concentric zero-trust rings -->
  <circle cx="400" cy="225" r="158" stroke="#60a5fa" stroke-opacity="0.22" stroke-dasharray="5 6" />
  <circle cx="400" cy="225" r="115" stroke="#a855f7" stroke-opacity="0.3" />

  <!-- Edge traffic lines -->
  <path d="M90 225 H285 M515 225 H710" stroke="url(#shieldGrad)" stroke-width="2" stroke-dasharray="4 4" />

