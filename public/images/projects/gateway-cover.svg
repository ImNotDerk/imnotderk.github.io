  <text x="150" y="222" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#93c5fd">OIDC / JWT</text>
  <text x="150" y="239" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">JWKS Cached</text>

  <rect x="586" y="196" width="128" height="58" rx="12" fill="#18102b" stroke="#c084fc" stroke-opacity="0.6" />
  <text x="650" y="222" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#e9d5ff">RATE LIMIT</text>
  <text x="650" y="239" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#a855f7">&lt; 1.8ms p95</text>
