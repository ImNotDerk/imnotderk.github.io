  <path d="M400 124 L476 156 V222 C476 274 443 310 400 328 C357 310 324 274 324 222 V156 L400 124 Z" fill="#0f172a" fill-opacity="0.92" stroke="url(#shieldGrad)" stroke-width="2.5" />
  <path d="M376 226 L393 243 L428 206" stroke="#c084fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Side chips -->
