<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgO" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070912" />
      <stop offset="55%" stop-color="#111226" />
      <stop offset="100%" stop-color="#1b1224" />
    </linearGradient>
    <linearGradient id="linkO" x1="296" y1="248" x2="504" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <pattern id="gridO" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgO)" />
  <rect width="800" height="450" fill="url(#gridO)" />

  <circle cx="195" cy="145" r="185" fill="#f59e0b" fill-opacity="0.10" />
  <circle cx="620" cy="310" r="195" fill="#38bdf8" fill-opacity="0.10" />

  <!-- Top Header Label -->
  <text x="56" y="64" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="2.2" fill="#f59e0b">PURE RUST WEBASSEMBLY  ·  63 KB BINARY  ·  0 CRATES</text>
  <text x="56" y="96" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">ZENITH // Offline Studio &amp; Game Engine</text>
  <line x1="56" y1="116" x2="744" y2="116" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1" />

  <!-- Bidirectional Memory Connector -->
  <path d="M296 248 H504" stroke="url(#linkO)" stroke-width="2" stroke-dasharray="6 4" />
  <polygon points="498,243 508,248 498,253" fill="#fb7185" />
  <polygon points="302,243 292,248 302,253" fill="#38bdf8" />
  <rect x="334" y="216" width="132" height="22" rx="4" fill="#0b1020" stroke="#f59e0b" stroke-opacity="0.45" />
  <text x="400" y="231" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#fde68a">WASM C-ABI FFI</text>
  <text x="400" y="269" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#bae6fd">TypedArray Views</text>

  <!-- Left Node: Zero-Copy Bridge -->
  <rect x="56" y="170" width="240" height="158" rx="12" fill="#0d1324" fill-opacity="0.92" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5" />
  <text x="78" y="202" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.4" fill="#38bdf8">ZERO-COPY BRIDGE</text>
  <text x="78" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#f8fafc">Shared Linear Memory</text>
  <text x="78" y="254" font-family="ui-monospace, monospace" font-size="10.5" fill="#94a3b8">TypedArray · Zero JSON FFI</text>
  <text x="78" y="274" font-family="ui-monospace, monospace" font-size="10.5" fill="#94a3b8">0.0% Idle CPU · Event-Driven</text>
  <text x="78" y="302" font-family="ui-monospace, monospace" font-size="9.5" fill="#cbd5e1">HTTP Stream + file:// Base64</text>

  <!-- Right Node: Rust WASM32 Core -->
  <rect x="504" y="170" width="240" height="158" rx="12" fill="#0d1324" fill-opacity="0.92" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.5" />
  <text x="526" y="202" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.4" fill="#fbbf24">RUST WASM32 CORE</text>
  <text x="526" y="228" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15.5" font-weight="600" fill="#f8fafc">Deterministic Engines + DSP</text>
  <text x="526" y="254" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">u64 2048 · MRV Sudoku Solver</text>
  <text x="526" y="274" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Bit-Packed Mines · SRS Tetris</text>
  <text x="526" y="302" font-family="ui-monospace, monospace" font-size="9.5" fill="#cbd5e1">44.1 kHz Procedural Audio DSP</text>

  <!-- Footer Spec Bar -->
  <line x1="56" y1="372" x2="744" y2="372" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1" />
  <text x="56" y="400" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">01 / Zero runtime heap allocations · 0.02–0.05 ms tick latency</text>
  <text x="744" y="400" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#fbbf24">RUST · WASM · 2026</text>
</svg>
